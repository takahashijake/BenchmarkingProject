[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "benchforge"
version = "0.2.0"
description = "Reproducible benchmarking for classical machine learning"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15.0",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pandas-stubs>=2.1",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
benchforge = "benchforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/benchforge"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["benchforge"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "sklearn.*", "yaml"]
ignore_missing_imports = true
