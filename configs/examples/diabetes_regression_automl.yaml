schema_version: 1
task: regression
dataset:
  name: diabetes
outer_split: {strategy: kfold, n_splits: 2, shuffle: true}
inner_split: {strategy: kfold, n_splits: 2, shuffle: true}
preprocessing: {median_imputation: true, standardize: true}
metrics: [root_mean_squared_error, mean_absolute_error, r2]
primary_metric: root_mean_squared_error
# This small offline example funds one trial per family/fold plus two final trials.
# Increase total_trials for real comparisons.
budget:
  total_trials: 10
  final_search_trials: 2
models:
  include: []
  exclude: []
  include_fixed_baselines: true
seed: 42
output:
  directory: artifacts
