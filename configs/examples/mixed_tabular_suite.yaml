schema_version: 1
task: binary_classification
dataset:
  source: csv
  path: configs/examples/data/mixed_customers.csv
  target_column: subscribed
  id_columns:
    - customer_id
  task: binary_classification
  categorical_cardinality_limit: 20
split:
  strategy: stratified_kfold
  n_splits: 3
  shuffle: true
preprocessing:
  median_imputation: true
  standardize: true
models:
  - name: dummy_classifier
  - name: logistic_regression
    parameters:
      max_iter: 1000
      solver: liblinear
  - name: extra_trees_classifier
    parameters:
      n_estimators: 80
  - name: hist_gradient_boosting_classifier
    parameters:
      max_iter: 60
metrics:
  - accuracy
  - balanced_accuracy
  - f1
  - roc_auc
primary_metric: balanced_accuracy
seed: 17
output:
  directory: artifacts
