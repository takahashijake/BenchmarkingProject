schema_version: 1
task: binary_classification
dataset:
  name: breast_cancer
split:
  strategy: stratified_kfold
  n_splits: 5
  shuffle: true
preprocessing:
  median_imputation: true
  standardize: true
model:
  name: logistic_regression
  parameters:
    C: 1.0
    max_iter: 1000
    solver: liblinear
metrics:
  - accuracy
  - balanced_accuracy
  - f1
  - roc_auc
seed: 42
output:
  directory: artifacts

