schema_version: 1
task: multiclass_classification
dataset:
  name: iris
split:
  strategy: stratified_kfold
  n_splits: 3
  shuffle: true
preprocessing:
  median_imputation: true
  standardize: true
model:
  name: logistic_regression
  parameters:
    C: 1.0
    max_iter: 1000
    solver: lbfgs
metrics:
  - accuracy
  - balanced_accuracy
  - f1_macro
seed: 42
output:
  directory: artifacts
