schema_version: 1
task: regression
dataset:
  name: diabetes
split:
  strategy: kfold
  n_splits: 5
  shuffle: true
preprocessing:
  median_imputation: true
  standardize: true
model:
  name: ridge_regressor
  parameters:
    alpha: 1.0
metrics:
  - root_mean_squared_error
  - mean_absolute_error
  - r2
seed: 42
output:
  directory: artifacts
