schema_version: 1
task: binary_classification
dataset:
  name: breast_cancer
split:
  strategy: stratified_kfold
  n_splits: 5
  shuffle: true
preprocessing:
  median_imputation: true
  standardize: false
model:
  name: random_forest_classifier
  parameters:
    n_estimators: 200
    max_depth: 8
    n_jobs: 1
metrics:
  - accuracy
  - balanced_accuracy
  - f1
  - roc_auc
seed: 42
output:
  directory: artifacts
