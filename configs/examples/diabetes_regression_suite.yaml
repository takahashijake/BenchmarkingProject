schema_version: 1
task: regression
dataset:
  name: diabetes
split:
  strategy: kfold
  n_splits: 5
  shuffle: true
preprocessing:
  median_imputation: true
  standardize: true
models:
  - name: dummy_regressor
    parameters: {strategy: mean}
  - name: linear_regression
  - name: ridge_regressor
    parameters: {alpha: 1.0}
  - name: random_forest_regressor
    parameters: {n_estimators: 100, max_depth: 8}
  - name: extra_trees_regressor
    parameters: {n_estimators: 100, max_depth: 8}
  - name: hist_gradient_boosting_regressor
    parameters: {max_iter: 100}
metrics: [root_mean_squared_error, mean_absolute_error, r2]
primary_metric: root_mean_squared_error
seed: 42
output:
  directory: artifacts
