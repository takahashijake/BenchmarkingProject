schema_version: 1
task: binary_classification
dataset:
  name: breast_cancer
outer_split:
  strategy: stratified_kfold
  n_splits: 2
  shuffle: true
inner_split:
  strategy: stratified_kfold
  n_splits: 2
  shuffle: true
preprocessing:
  median_imputation: true
  standardize: true
models:
  - name: logistic_regression
    id: logistic
    mode: search
  - name: random_forest_classifier
    id: random_forest
    mode: search
  - name: extra_trees_classifier
    id: extra_trees
    mode: search
  - name: hist_gradient_boosting_classifier
    id: hist_gradient_boosting
    mode: search
  - name: dummy_classifier
    id: dummy
    mode: fixed
    parameters:
      strategy: prior
metrics:
  - roc_auc
  - balanced_accuracy
  - f1
primary_metric: roc_auc
budget:
  trials_per_outer_fold: 2
final_search:
  enabled: true
  trials: 3
seed: 42
output:
  directory: artifacts
